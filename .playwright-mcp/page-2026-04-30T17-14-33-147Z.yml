          - paragraph [ref=e40]: Nestled in the vibrant heart of Shaheen Bagh, 1Mysa Café brings the authentic flavors of Turkish and Middle Eastern desserts to Delhi. Our passion lies in crafting the perfect Kunafa - crispy, golden, and dripping with sweet syrup.
